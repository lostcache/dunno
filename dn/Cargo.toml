[package]
name = "dn"
version.workspace = true
edition.workspace = true
default-run = "dn"

[[bin]]
name = "dn"
path = "src/main.rs"

[dependencies]
dn-core = { path = "../dn-core" }
anyhow = "1.0.101"
clap = { version = "4.5.59", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
