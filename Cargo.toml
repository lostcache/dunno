[package]
name = "dunno"
version = "0.1.0"
edition = "2024"
default-run = "dn"

[[bin]]
name = "dn"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.101"
clap = { version = "4.5.59", features = ["derive"] }
dirs = "6.0.0"
qdrant-client = "1.16.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
surrealdb = { version = "3.0.0", features = ["kv-mem", "kv-surrealkv", "protocol-ws"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "1.49.0", features = ["full"] }
toml = "1.0.2"

[dev-dependencies]
uuid = { version = "1.21.0", features = ["v4"] }
cargo-llvm-cov = "0.6"
