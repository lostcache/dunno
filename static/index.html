<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dunno UI</title>
<script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; font-size: 14px; height: 100vh; display: flex; flex-direction: column; background: #0f1117; color: #e2e8f0; }

  nav { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: #1a1d27; border-bottom: 1px solid #2d3148; flex-shrink: 0; }
  nav h1 { font-size: 16px; font-weight: 700; color: #a78bfa; margin-right: 8px; }
  nav select { background: #252840; color: #e2e8f0; border: 1px solid #3d4165; padding: 4px 8px; border-radius: 4px; }
  nav button { background: #252840; color: #e2e8f0; border: 1px solid #3d4165; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
  nav button:hover { background: #3d4165; }
  nav .view-btns { margin-left: auto; display: flex; gap: 6px; }
  nav .view-btns button.active { background: #5b45d6; border-color: #7c6df0; }

  .main-area { display: flex; flex: 1; overflow: hidden; }

  aside { width: 220px; flex-shrink: 0; background: #14172a; border-right: 1px solid #2d3148; display: flex; flex-direction: column; overflow: hidden; }
  .entity-tabs { display: flex; flex-direction: column; overflow-y: auto; flex: 1; padding: 8px 0; }
  .entity-tab { padding: 6px 16px; cursor: pointer; color: #94a3b8; font-size: 13px; border-left: 3px solid transparent; }
  .entity-tab:hover { background: #1e2135; color: #e2e8f0; }
  .entity-tab.active { border-left-color: #7c6df0; color: #a78bfa; background: #1e2135; }
  .sidebar-actions { padding: 10px 12px; border-top: 1px solid #2d3148; display: flex; gap: 6px; }
  .sidebar-actions button { flex: 1; padding: 6px; background: #5b45d6; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .sidebar-actions button:hover { background: #7c6df0; }
  .item-list { padding: 0 8px 8px; overflow-y: auto; max-height: 280px; }
  .item-row { padding: 5px 8px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #cbd5e1; font-size: 12px; }
  .item-row:hover { background: #1e2135; }
  .item-row .del-btn { opacity: 0; color: #f87171; font-size: 11px; border: none; background: none; cursor: pointer; }
  .item-row:hover .del-btn { opacity: 1; }

  main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

  /* Graph view */
  #graph-view { flex: 1; display: flex; flex-direction: column; position: relative; }
  #cy { flex: 1; background: #0f1117; }
  #node-detail { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px 16px; background: #14172a; border-top: 1px solid #2d3148; max-height: 160px; overflow-y: auto; font-size: 12px; display: none; z-index: 10; }
  #node-detail h3 { color: #a78bfa; margin-bottom: 6px; }
  #node-detail pre { white-space: pre-wrap; word-break: break-all; color: #94a3b8; }
  #multi-select-panel { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px 16px; background: #14172a; border-top: 1px solid #2d3148; max-height: 200px; overflow-y: auto; font-size: 12px; display: none; z-index: 10; }
  #multi-select-panel h3 { color: #a78bfa; }
  #msp-pairs { margin-top: 8px; }
  #msp-pairs .pair-row { padding: 4px 0; border-bottom: 1px solid #2d3148; color: #94a3b8; font-size: 11px; }
  #msp-pairs .pair-row:last-child { border-bottom: none; }
  #msp-pairs .pair-row.no-pair { color: #475569; }

  /* Context view */
  #ctx-view { flex: 1; padding: 20px; display: none; flex-direction: column; gap: 12px; min-height: 0; overflow: hidden; }
  #ctx-view .ctx-controls { display: flex; gap: 8px; align-items: center; }
  #ctx-view select, #ctx-view input { background: #252840; color: #e2e8f0; border: 1px solid #3d4165; padding: 6px 10px; border-radius: 4px; }
  #ctx-id-container { flex: 1; display: flex; }
  #ctx-id-container input, #ctx-id-container select { flex: 1; background: #252840; color: #e2e8f0; border: 1px solid #3d4165; padding: 6px 10px; border-radius: 4px; }
  #ctx-view button { padding: 6px 14px; background: #5b45d6; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  #ctx-view button:hover { background: #7c6df0; }
  #ctx-view label { display: flex; align-items: center; gap: 4px; color: #94a3b8; }
  #ctx-output { flex: 1; overflow-y: auto; min-height: 0; }
  #ctx-output pre { background: #14172a; border: 1px solid #2d3148; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; color: #94a3b8; font-size: 12px; }

  /* Status bar */
  #status { padding: 5px 16px; background: #14172a; border-top: 1px solid #2d3148; font-size: 12px; color: #64748b; flex-shrink: 0; min-height: 24px; }
  #status.ok { color: #4ade80; }
  #status.err { color: #f87171; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; display: flex; align-items: center; justify-content: center; }
  .modal { background: #1a1d27; border: 1px solid #3d4165; border-radius: 8px; padding: 20px; min-width: 360px; max-width: 500px; width: 90%; }
  .modal h2 { color: #a78bfa; margin-bottom: 14px; font-size: 16px; }
  .modal label { display: block; margin-bottom: 10px; }
  .modal label span { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
  .modal input, .modal textarea, .modal select { width: 100%; background: #252840; color: #e2e8f0; border: 1px solid #3d4165; padding: 6px 10px; border-radius: 4px; font-size: 13px; font-family: inherit; }
  .modal textarea { height: 80px; resize: vertical; }
  .modal .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .modal .modal-btns button { padding: 6px 16px; border-radius: 4px; cursor: pointer; border: none; font-size: 13px; }
  .modal .modal-btns .cancel { background: #252840; color: #94a3b8; }
  .modal .modal-btns .submit { background: #5b45d6; color: #fff; }
  .modal .modal-btns .submit:hover { background: #7c6df0; }

  /* Node hover action buttons */
  #node-hover-btns { position: absolute; display: none; gap: 4px; z-index: 20; pointer-events: auto; transform: translate(-50%, calc(-100% - 8px)); }
  #node-hover-btns button { padding: 3px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; color: #fff; }
  #node-hover-btns .nhb-edit { background: #5b45d6; }
  #node-hover-btns .nhb-delete { background: #dc2626; }
  #node-hover-btns button:hover { opacity: 0.85; }

  /* Filter panel */
  #filter-panel { background: #1a1d27; border-bottom: 1px solid #2d3148; padding: 8px 16px; display: flex; gap: 24px; flex-wrap: wrap; flex-shrink: 0; }
  .filter-section { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .filter-section strong { margin-right: 4px; font-size: 11px; color: #94a3b8; white-space: nowrap; }
  .filter-checkbox { display: flex; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; color: #cbd5e1; user-select: none; }
  .filter-checkbox input { cursor: pointer; }
  .filter-dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex-shrink: 0; }
  #btn-filter.active { background: #5b45d6; border-color: #7c6df0; }

</style>
</head>
<body>

<nav>
  <h1>Dunno UI</h1>
  <select id="project-select"><option value="">— select project —</option></select>
  <button onclick="App.refresh()" title="Refresh">↻</button>
  <button id="btn-filter" class="active" onclick="App.toggleFilterPanel()">Filter</button>
  <div class="view-btns">
    <button id="btn-graph" class="active" onclick="App.setView('graph')">Graph</button>
    <button id="btn-ctx" onclick="App.setView('ctx')">Context</button>
  </div>
</nav>

<div id="filter-panel" style="display:flex"></div>

<div class="main-area">
  <aside>
    <div class="entity-tabs" id="entity-tabs"></div>
    <div class="item-list" id="item-list"></div>
    <div class="sidebar-actions">
      <button onclick="App.openCreate()">+ Create</button>
    </div>
  </aside>

  <main>
    <div id="graph-view">
      <div id="cy"></div>
      <div id="node-hover-btns">
        <button class="nhb-edit" onclick="App.openEdit()">Edit</button>
        <button class="nhb-delete" onclick="App.deleteNode()">Delete</button>
      </div>
      <div id="node-detail">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
          <h3 id="nd-title"></h3>
          <div style="display:flex;gap:6px;">
            <button onclick="App.openAddLink()" style="padding:3px 10px;background:#16a34a;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px;">Add &amp; Link</button>
            <button onclick="App.openEdit()" style="padding:3px 10px;background:#5b45d6;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px;">Edit</button>
          </div>
        </div>
        <pre id="nd-body"></pre>
      </div>
      <div id="multi-select-panel">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
          <h3 id="msp-title"></h3>
          <button onclick="App.linkSelected()" style="padding:3px 10px;background:#16a34a;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px;">Link</button>
        </div>
        <div id="msp-pairs"></div>
      </div>
    </div>

    <div id="ctx-view">
      <div class="ctx-controls">
        <select id="ctx-type" onchange="App.onCtxTypeChange()">
          <option value="task">Task</option>
          <option value="file">File</option>
          <option value="epic">Epic</option>
        </select>
        <div id="ctx-id-container"><input id="ctx-id" placeholder="record id e.g. task:abc123"></div>
        <label><input type="checkbox" id="ctx-full"> Full</label>
        <button onclick="App.fetchCtx()">Fetch</button>
      </div>
      <div id="ctx-output"><pre>Select type and enter an ID, then click Fetch.</pre></div>
    </div>
  </main>
</div>

<div id="status">Ready</div>

<div id="modal" class="modal-overlay" style="display:none">
  <div class="modal">
    <h2 id="modal-title">Create</h2>
    <form id="modal-form"></form>
    <div class="modal-btns">
      <button class="cancel" onclick="App.closeModal()">Cancel</button>
      <button class="submit" onclick="App.submitCreate()">Create</button>
    </div>
  </div>
</div>

<script>
const ENTITY_TABS = [

];

const SCHEMAS = {

    { name:'name', label:'Name', type:'text', required:true },

  ],
  modules: [

    { name:'notes', label:'Notes', type:'textarea' },
    { name:'project_id', label:'Project ID', type:'text', required:true, fill:'projectId' },
  ],

const EDIT_SCHEMAS = {

  ],

    { name:'name', label:'Name', type:'text' },

  ],
  submodule: [

  file: [

  epic: [

  ],
  persona: [

  ],

  ],

  ],
};

const EDIT_ENDPOINTS = {
  project: '/api/projects',
  module: '/api/modules',
  submodule: '/api/submodules',
  file: '/api/files',
  task: '/api/tasks',
  todo_item: '/api/todos',
  user_story: '/api/user-stories',
  epic: '/api/epics',
  persona: '/api/personas',
  workflow: '/api/workflows',
  context: '/api/contexts',
};

const EDGE_PAIRS = [
  { a:'project',    b:'module',     a_to_b:'contains',         b_to_a:'belongs_to_project' },
  { a:'project',    b:'submodule',  a_to_b:'contains',         b_to_a:'belongs_to_project' },
  { a:'project',    b:'file',       a_to_b:'contains',         b_to_a:'belongs_to_project' },
  { a:'project',    b:'task',       a_to_b:'has_task',         b_to_a:'belongs_to_project' },
  { a:'project',    b:'user_story', a_to_b:'has_user_story',   b_to_a:'belongs_to_project' },
  { a:'project',    b:'epic',       a_to_b:'has_epic',         b_to_a:'belongs_to_project' },
  { a:'project',    b:'todo_item',  a_to_b:'has_todo',         b_to_a:'belongs_to_project' },
  { a:'project',    b:'persona',    a_to_b:'has_persona',      b_to_a:'belongs_to_project' },
  { a:'project',    b:'workflow',   a_to_b:'has_workflow',     b_to_a:'belongs_to_project' },
  { a:'module',     b:'submodule',  a_to_b:'contains',         b_to_a:'belongs_to_module'  },
  { a:'module',     b:'file',       a_to_b:'contains',         b_to_a:'belongs_to_module'  },
  { a:'module',     b:'task',       a_to_b:'has_task',         b_to_a:'belongs_to_module'  },
  { a:'submodule',  b:'file',       a_to_b:'contains',         b_to_a:'belongs_to_submodule' },
  { a:'epic',       b:'user_story', a_to_b:'has_user_story',   b_to_a:'belongs_to_epic'    },
  { a:'epic',       b:'task',       a_to_b:'has_task',         b_to_a:'belongs_to_epic'    },
  { a:'user_story', b:'task',       a_to_b:'has_task',         b_to_a:'belongs_to_story'   },
];

function findEdgePair(typeA, typeB) {
  return EDGE_PAIRS.find(p =>
    (p.a === typeA && p.b === typeB) || (p.a === typeB && p.b === typeA)
  );
}

const ALL_EDGE_TYPES = [
  'contains','has_task','has_context','belongs_to_project','belongs_to_module',
  'belongs_to_submodule','belongs_to_task','belongs_to_story','has_todo',
  'has_user_story','belongs_to_user_story','belongs_to_epic','has_epic',
  'has_persona','has_workflow','has_module','has_submodule',
];

const CREATE_ENDPOINTS = {
  projects:'/api/projects', modules:'/api/modules', submodules:'/api/submodules',
  files:'/api/files', tasks:'/api/tasks', todos:'/api/todos',
  'user-stories':'/api/user-stories', epics:'/api/epics',
  personas:'/api/personas', workflows:'/api/workflows', contexts:'/api/contexts',
};

// Maps CREATE_ENDPOINTS key → node_type used in EDGE_PAIRS
const TYPE_MAP = {
  projects:'project', modules:'module', submodules:'submodule',
  files:'file', tasks:'task', todos:'todo_item',
  'user-stories':'user_story', epics:'epic',
  personas:'persona', workflows:'workflow', contexts:'context',

// Node colors by type
const NODE_COLORS = {

  module:      { bg:'#8b5cf6', fg:'#fff' },

function darkenColor(hex, pct) {
  const num = parseInt(hex.replace('#',''), 16);
  const amt = Math.round(2.55 * pct);
  const r = Math.max(0, (num >> 16) - amt);
  const g = Math.max(0, ((num >> 8) & 0xff) - amt);
  const b = Math.max(0, (num & 0xff) - amt);
  return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
}

function wrapText(str, maxLen = 80) {
  if (!str) return '';
  const words = str.split(' ');
  let lines = [];
  let currentLine = '';

  for (const word of words) {
    if (word.length > maxLen) {
      if (currentLine) lines.push(currentLine);
      lines.push(word);
      currentLine = '';
    } else if (currentLine.length + word.length + (currentLine ? 1 : 0) <= maxLen) {
      currentLine = currentLine ? currentLine + ' ' + word : word;
    } else {
      lines.push(currentLine);
      currentLine = word;
    }
  }
  if (currentLine) lines.push(currentLine);
  return lines.join('\n');
}

const App = {
  projectId: null,
  activeTab: 'projects',
  mainView: 'graph',
  cy: null,
  editingNode: null,
  hiddenNodeTypes: new Set(),
  hiddenEdgeTypes: new Set(),

  async init() {
    this.buildEntityTabs();
    this.buildFilterPanel();
    await this.loadProjects();
    this.initCy();
    await this.loadGraph();
    await this.loadItems();
  },

  buildEntityTabs() {
    const el = document.getElementById('entity-tabs');
    el.innerHTML = ENTITY_TABS.map(t =>
      `<div class="entity-tab${t===this.activeTab?' active':''}" onclick="App.setTab('${t}')">${t}</div>`
    ).join('');
  },

  buildFilterPanel() {
    const panel = document.getElementById('filter-panel');
    const nodeSection = Object.keys(NODE_COLORS).map(type => {
      const color = NODE_COLORS[type].bg;
      return `<label class="filter-checkbox">
        <input type="checkbox" checked onchange="App.toggleNodeType('${type}', this.checked)">
        <span class="filter-dot" style="background:${color}"></span>
        ${type}
      </label>`;
    }).join('');
    const edgeSection = ALL_EDGE_TYPES.map(type =>
      `<label class="filter-checkbox">
        <input type="checkbox" checked onchange="App.toggleEdgeType('${type}', this.checked)">
        ${type}
      </label>`
    ).join('');
    panel.innerHTML = `
      <div class="filter-section"><strong>Nodes</strong>${nodeSection}</div>
      <div class="filter-section"><strong>Edges</strong>${edgeSection}</div>
    `;
  },

  toggleFilterPanel() {
    const panel = document.getElementById('filter-panel');
    const btn = document.getElementById('btn-filter');
    const open = panel.style.display === 'none';
    panel.style.display = open ? 'flex' : 'none';
    btn.classList.toggle('active', open);
  },

  toggleNodeType(type, visible) {
    if (visible) this.hiddenNodeTypes.delete(type);
    else this.hiddenNodeTypes.add(type);
    this.applyFilters();
  },

  toggleEdgeType(type, visible) {
    if (visible) this.hiddenEdgeTypes.delete(type);
    else this.hiddenEdgeTypes.add(type);
    this.applyFilters();
  },

  applyFilters() {
    if (!this.cy) return;
    this.cy.elements().show();
    this.hiddenNodeTypes.forEach(t => this.cy.nodes(`[node_type = "${t}"]`).hide());
    this.hiddenEdgeTypes.forEach(t => this.cy.edges(`[edge_type = "${t}"]`).hide());
    this.cy.nodes(':hidden').connectedEdges().hide();
  },

  async loadProjects() {
    const projects = await api('/api/projects');
    const sel = document.getElementById('project-select');
    const cur = sel.value;
    sel.innerHTML = '<option value="">— select project —</option>' +
      projects.map(p => `<option value="${p.id}"${p.id===cur?' selected':''}>${p.name}</option>`).join('');
    if (!this.projectId && projects.length) {
      this.projectId = projects[0].id;
      sel.value = this.projectId;
    }
    sel.onchange = () => { this.projectId = sel.value || null; this.refresh(); };
  },

  async refresh() {
    await this.loadProjects();
    await this.loadGraph();
    await this.loadItems();
    status('Refreshed', 'ok');
  },

  setTab(tab) {
    this.activeTab = tab;
    document.querySelectorAll('.entity-tab').forEach(el => {
      el.classList.toggle('active', el.textContent === tab);
    });
    this.loadItems();
  },

  setView(view) {
    this.mainView = view;
    document.getElementById('graph-view').style.display = view === 'graph' ? 'flex' : 'none';
    document.getElementById('ctx-view').style.display = view === 'ctx' ? 'flex' : 'none';
    document.getElementById('btn-graph').classList.toggle('active', view === 'graph');
    document.getElementById('btn-ctx').classList.toggle('active', view === 'ctx');
    if (view === 'ctx') this.onCtxTypeChange();
  },

  initCy() {
    this.cy = cytoscape({
      container: document.getElementById('cy'),
      style: [
        {
          selector: 'node',
          style: {
            'label': ele => (FRIENDLY_TYPES[ele.data('node_type')] || ele.data('node_type') || '') + '\n' + wrapText(ele.data('label') || ''),
            'text-wrap': 'wrap',
            'color': ele => (NODE_COLORS[ele.data('node_type')] || {fg:'#fff'}).fg,
            'background-fill': 'linear-gradient',
            'background-gradient-direction': 'to-bottom',
            'background-gradient-stop-colors': ele => {
              const bg = (NODE_COLORS[ele.data('node_type')] || {bg:'#64748b'}).bg;
              const dark = darkenColor(bg, 28);
              return `${dark} ${dark} ${bg} ${bg}`;
            },
            'background-gradient-stop-positions': '0 48 48 100',
            'text-valign': 'center',
            'text-halign': 'center',
            'font-size': '11px',
            'width': 'label',
            'height': 'label',
            'padding': '8px',
            'shape': ele => {
              const t = ele.data('node_type');
              if (t === 'context') return 'diamond';
              if (t === 'persona' || t === 'workflow') return 'star';
              return 'roundrectangle';
            },
          }
        },
        {
          selector: 'edge',
          style: {
            'label': 'data(edge_type)',
            'font-size': '9px',
            'color': '#64748b',
            'curve-style': 'bezier',
            'target-arrow-shape': 'triangle',
            'line-color': '#3d4165',
            'target-arrow-color': '#3d4165',
            'width': 1,
            'text-rotation': 'autorotate',
          }
        },
        {
          selector: ':selected',
          style: { 'border-width': 2, 'border-color': '#a78bfa' }
        },
      ],
      layout: { name: 'cose' },
      wheelSensitivity: 0.3,
      boxSelectionEnabled: true,
    });

    this.cy.on('tap', 'node', () => {
      // Defer to select/unselect events which fire after tap updates selection
      setTimeout(() => this.onSelectionChange(), 0);
    });

    this._hoverHideTimer = null;
    const hoverDiv = document.getElementById('node-hover-btns');
    this.cy.on('mouseover', 'node', evt => {
      clearTimeout(this._hoverHideTimer);
      const node = evt.target;
      this.editingNode = node.data();
      const cyRect = this.cy.container().getBoundingClientRect();
      const graphRect = document.getElementById('graph-view').getBoundingClientRect();
      const pos = node.renderedPosition();
      hoverDiv.style.left = (cyRect.left - graphRect.left + pos.x) + 'px';
      hoverDiv.style.top  = (cyRect.top  - graphRect.top  + pos.y) + 'px';
      hoverDiv.style.display = 'flex';
    });
    this.cy.on('mouseout', 'node', () => {
      this._hoverHideTimer = setTimeout(() => { hoverDiv.style.display = 'none'; }, 200);
    });
    hoverDiv.addEventListener('mouseenter', () => clearTimeout(this._hoverHideTimer));
    hoverDiv.addEventListener('mouseleave', () => {
      this._hoverHideTimer = setTimeout(() => { hoverDiv.style.display = 'none'; }, 200);
    });
    this.cy.on('tap', evt => {
      if (evt.target === this.cy) {
        this.cy.$('node:selected').unselect();
        document.getElementById('node-detail').style.display = 'none';
        document.getElementById('multi-select-panel').style.display = 'none';
        this.editingNode = null;
      }
    });
    this.cy.on('select unselect', 'node', () => {
      setTimeout(() => this.onSelectionChange(), 0);
    });
  },

  async loadGraph() {
    try {
      const url = this.projectId ? `/api/projects/${this.projectId}/graph` : '/api/graph';
      const data = await api(url);
      this.cy.elements().remove();
      this.cy.add(data.elements);
      this.cy.layout({ name: 'cose', animate: false, randomize: true }).run();
      this.applyFilters();
    } catch(e) {
      status('Graph load failed: ' + e.message, 'err');
    }
  },

  async loadItems() {
    const tab = this.activeTab;
    const pid = this.projectId;
    let url;
    try {
      if (tab === 'projects') url = '/api/projects';
      else if (tab === 'modules' && pid) url = `/api/projects/${pid}/modules`;
      else if (tab === 'modules') url = '/api/modules';
      else if (tab === 'submodules' && pid) { /* loaded via module */ url = null; }
      else if (tab === 'files' && pid) url = `/api/projects/${pid}/files`;
      else if (tab === 'tasks' && pid) url = `/api/projects/${pid}/tasks`;
      else if (tab === 'todos' && pid) url = `/api/projects/${pid}/todos`;
      else if (tab === 'user-stories' && pid) url = `/api/projects/${pid}/user-stories`;
      else if (tab === 'epics' && pid) url = `/api/projects/${pid}/epics`;
      else if (tab === 'personas' && pid) url = `/api/projects/${pid}/personas`;
      else if (tab === 'workflows' && pid) url = `/api/projects/${pid}/workflows`;
      else { url = null; }

      if (!url) { document.getElementById('item-list').innerHTML = '<div style="padding:8px;color:#64748b;font-size:12px;">Select a project</div>'; return; }
      const items = await api(url);
      this.renderItems(items, tab);
    } catch(e) {
      status('Load failed: ' + e.message, 'err');
    }
  },

  renderItems(items, tab) {
    const el = document.getElementById('item-list');
    if (!items.length) { el.innerHTML = '<div style="padding:8px;color:#64748b;font-size:12px;">No items</div>'; return; }
    el.innerHTML = items.map(item => {
      const label = item.name || item.title || item.content || item.id || '?';
      const id = item.id || '';
      return `<div class="item-row"
        onmouseenter="App.hoverNode('${id}')"
        onmouseleave="App.unhoverNode()"
        onclick="App.selectNode('${id}')">
        <span title="${id}">${label.length > 28 ? label.slice(0,28)+'…' : label}</span>
        <button class="del-btn" onclick="App.deleteItem('${tab}','${id}',event)">✕</button>
      </div>`;
    }).join('');
  },

  hoverNode(id) {
    clearTimeout(this._hoverHideTimer);
    const node = this.cy && this.cy.getElementById(id);
    if (!node || !node.length) return;
    this.editingNode = node.data();
    const hoverDiv = document.getElementById('node-hover-btns');
    const cyRect = this.cy.container().getBoundingClientRect();
    const graphRect = document.getElementById('graph-view').getBoundingClientRect();
    const pos = node.renderedPosition();
    hoverDiv.style.left = (cyRect.left - graphRect.left + pos.x) + 'px';
    hoverDiv.style.top  = (cyRect.top  - graphRect.top  + pos.y) + 'px';
    hoverDiv.style.display = 'flex';
  },

  unhoverNode() {
    this._hoverHideTimer = setTimeout(() => {
      document.getElementById('node-hover-btns').style.display = 'none';
    }, 200);
  },

  selectNode(id) {
    const node = this.cy && this.cy.getElementById(id);
    if (!node || !node.length) return;
    this.cy.$('node:selected').unselect();
    node.select();
    this.cy.animate({ center: { eles: node }, duration: 300 });
  },

  async deleteItem(tab, id, evt) {
    evt.stopPropagation();
    const endpoints = {
      projects: '/api/projects',
      modules: '/api/modules',
      submodules: '/api/submodules',
      files: '/api/files',
      tasks: '/api/tasks',
      todos: '/api/todos',
      'user-stories': '/api/user-stories',
      epics: '/api/epics',
      personas: '/api/personas',
      workflows: '/api/workflows',
    };
    const base = endpoints[tab];
    if (!base) return;
    try {
      await apiDel(`${base}/${encodeURIComponent(id)}`);
      status(`Deleted ${id}`, 'ok');
      this.refresh();
    } catch(e) {
      status('Delete failed: ' + e.message, 'err');
    }
  },

  openCreate() {
    const btn = document.querySelector('#modal .modal-btns .submit');
    btn.textContent = 'Create';
    btn.onclick = () => App.submitCreate();
    const tab = this.activeTab;
    if (tab === 'contexts') { this.openCreateContext(); return; }
    const schema = SCHEMAS[tab];
    if (!schema) { status('No create form for ' + tab, 'err'); return; }
    document.getElementById('modal-title').textContent = 'Create ' + tab.slice(0,-1);
    const form = document.getElementById('modal-form');
    form.innerHTML = schema.map(f => {
      const val = f.fill === 'projectId' ? (this.projectId || '') : '';
      const inp = f.type === 'textarea'
        ? `<textarea name="${f.name}" ${f.required?'required':''}>${val}</textarea>`
        : `<input type="text" name="${f.name}" value="${val}" ${f.required?'required':''}>`;
      return `<label><span>${f.label}${f.required?' *':''}</span>${inp}</label>`;
    }).join('');
    document.getElementById('modal').style.display = 'flex';
  },

  openCreateContext() {
    const btn = document.querySelector('#modal .modal-btns .submit');
    btn.textContent = 'Create';
    btn.onclick = () => App.submitCreate();
    const schema = SCHEMAS['contexts'];
    document.getElementById('modal-title').textContent = 'Create Context';
    const form = document.getElementById('modal-form');
    form.innerHTML = schema.map(f => {
      const inp = f.type === 'textarea'
        ? `<textarea name="${f.name}" ${f.required?'required':''}></textarea>`
        : `<input type="text" name="${f.name}" ${f.required?'required':''}>`;
      return `<label><span>${f.label}${f.required?' *':''}</span>${inp}</label>`;
    }).join('');
    document.getElementById('modal').style.display = 'flex';
  },

  openEdit() {
    const data = this.editingNode;
    if (!data) { status('No node selected', 'err'); return; }
    const schema = EDIT_SCHEMAS[data.node_type];
    if (!schema) { status('No edit form for ' + data.node_type, 'err'); return; }
    document.getElementById('modal-title').textContent = `Edit ${data.node_type}: ${data.label}`;
    const form = document.getElementById('modal-form');
    form.innerHTML = schema.map(f => {
      const val = (data[f.name] != null ? data[f.name] : '');
      let inp;
      if (f.type === 'textarea') {
        inp = `<textarea name="${f.name}">${val}</textarea>`;
      } else if (f.type === 'select') {
        const opts = f.options.map(o => `<option value="${o}"${o===val?' selected':''}>${o}</option>`).join('');
        inp = `<select name="${f.name}">${opts}</select>`;
      } else {
        inp = `<input type="text" name="${f.name}" value="${val}">`;
      }
      return `<label><span>${f.label}</span>${inp}</label>`;
    }).join('');
    const submitBtn = document.querySelector('#modal .modal-btns .submit');
    submitBtn.textContent = 'Save';
    submitBtn.onclick = () => App.submitEdit();
    document.getElementById('modal').style.display = 'flex';
  },

  async deleteNode() {
    const data = this.editingNode;
    if (!data) return;
    const base = EDIT_ENDPOINTS[data.node_type];
    if (!base) { status('No delete endpoint for ' + data.node_type, 'err'); return; }
    document.getElementById('node-hover-btns').style.display = 'none';
    try {
      await apiDel(`${base}/${encodeURIComponent(data.id)}`);
      document.getElementById('node-detail').style.display = 'none';
      this.editingNode = null;
      status('Deleted ' + data.label, 'ok');
      this.refresh();
    } catch(e) {
      status('Delete failed: ' + e.message, 'err');
    }
  },

  async submitEdit() {
    const data = this.editingNode;
    if (!data) return;
    const nodeType = data.node_type;
    const endpoint = EDIT_ENDPOINTS[nodeType];
    if (!endpoint) { status('No endpoint for ' + nodeType, 'err'); return; }
    const form = document.getElementById('modal-form');
    const raw = Object.fromEntries(new FormData(form).entries());
    let body;
    if (nodeType === 'context') {
      body = { fields: raw };
    } else {
      body = raw;
    }
    try {
      await apiPatch(`${endpoint}/${encodeURIComponent(data.id)}`, body);
      this.closeModal();
      document.getElementById('node-detail').style.display = 'none';
      this.editingNode = null;
      status('Saved', 'ok');
      this.refresh();
    } catch(e) {
      status('Save failed: ' + e.message, 'err');
    }
  },

  onSelectionChange() {
    const selected = this.cy.$('node:selected');
    const detail = document.getElementById('node-detail');
    const multiPanel = document.getElementById('multi-select-panel');
    if (selected.length >= 2) {
      detail.style.display = 'none';
      this.editingNode = null;
      this._showMultiPanel(selected.map(n => n.data()));
    } else if (selected.length === 1) {
      multiPanel.style.display = 'none';
      const data = selected[0].data();
      this.editingNode = data;
      this._showDetailPanel(data);
    } else {
      detail.style.display = 'none';
      multiPanel.style.display = 'none';
      this.editingNode = null;
    }
  },

  _showDetailPanel(data) {
    document.getElementById('nd-title').textContent = `${data.node_type}: ${data.label}`;
    document.getElementById('nd-body').textContent = JSON.stringify(data, null, 2);
    document.getElementById('node-detail').style.display = 'block';
  },

  _showMultiPanel(nodes) {
    document.getElementById('msp-title').textContent = `${nodes.length} nodes selected`;
    const rows = [];
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const pair = findEdgePair(a.node_type, b.node_type);
        if (pair) {
          const [src, dst] = pair.a === a.node_type ? [a, b] : [b, a];
          rows.push(`<div class="pair-row">
            <span>${src.label} → <em>${pair.a_to_b}</em> → ${dst.label}</span><br>
            <span>${dst.label} → <em>${pair.b_to_a}</em> → ${src.label}</span>
          </div>`);
        } else if (a.node_type === 'context' || b.node_type === 'context') {
          const [nonCtx, ctx] = a.node_type === 'context' ? [b, a] : [a, b];
          rows.push(`<div class="pair-row">${nonCtx.label} → <em>has_context</em> → ${ctx.label}</div>`);
        } else {
          rows.push(`<div class="pair-row no-pair">${a.label} ↔ ${b.label}: no known edge pair</div>`);
        }
      }
    }
    document.getElementById('msp-pairs').innerHTML = rows.join('');
    document.getElementById('multi-select-panel').style.display = 'block';
  },

  async linkSelected() {
    const selected = this.cy.$('node:selected').map(n => n.data());
    let linked = 0;
    const errors = [];
    for (let i = 0; i < selected.length; i++) {
      for (let j = i + 1; j < selected.length; j++) {
        const a = selected[i], b = selected[j];
        const pair = findEdgePair(a.node_type, b.node_type);
        if (pair) {
          const [srcId, dstId] = pair.a === a.node_type ? [a.id, b.id] : [b.id, a.id];
          try {
            await apiPost('/api/link', { from_id: srcId, edge: pair.a_to_b, to_id: dstId });
            await apiPost('/api/link', { from_id: dstId, edge: pair.b_to_a, to_id: srcId });
            linked++;
          } catch(e) { errors.push(e.message); }
        } else if (a.node_type === 'context' || b.node_type === 'context') {
          const [nonCtx, ctx] = a.node_type === 'context' ? [b, a] : [a, b];
          try {
            await apiPost('/api/link', { from_id: nonCtx.id, edge: 'has_context', to_id: ctx.id });
            linked++;
          } catch(e) { errors.push(e.message); }
        }
      }
    }
    if (errors.length) {
      status(`Linked ${linked} pair(s), ${errors.length} error(s): ${errors[0]}`, 'err');
    } else if (linked > 0) {
      status(`Linked ${linked} pair(s)`, 'ok');
      this.refresh();
    } else {
      status('No linkable pairs found', 'err');
    }
  },

  openAddLink() {
    const data = this.editingNode;
    if (!data) { status('No node selected', 'err'); return; }
    document.getElementById('modal-title').textContent = `Add & Link to: ${data.label}`;
    const typeOptions = Object.keys(CREATE_ENDPOINTS)
      .map(t => `<option value="${t}">${t}</option>`).join('');
    const form = document.getElementById('modal-form');
    form.innerHTML = `
      <label><span>Node Type *</span>
        <select name="new_node_type" onchange="App._updateAddLinkFields(this.value)">${typeOptions}</select>
      </label>
      <div id="add-link-fields"></div>
    `;
    const btn = document.querySelector('#modal .modal-btns .submit');
    btn.textContent = 'Create & Link';
    btn.onclick = () => App.submitAddLink();
    document.getElementById('modal').style.display = 'flex';
    this._updateAddLinkFields(Object.keys(CREATE_ENDPOINTS)[0]);
  },

  _updateAddLinkFields(type) {
    const data = this.editingNode;
    const container = document.getElementById('add-link-fields');
    if (!container || !data) return;
    const schema = SCHEMAS[type];
    if (!schema) { container.innerHTML = ''; return; }

    if (type === 'contexts') {
      const ctxFields = schema.filter(f => f.name !== 'link_to');
      let html = ctxFields.map(f => {
        const inp = f.type === 'textarea'
          ? `<textarea name="field_${f.name}" ${f.required?'required':''}></textarea>`
          : `<input type="text" name="field_${f.name}" ${f.required?'required':''}>`;
        return `<label><span>${f.label}${f.required?' *':''}</span>${inp}</label>`;
      }).join('');
      html += `<input type="hidden" name="field_link_to" value="${data.id}">`;
      container.innerHTML = html;
    } else {
      let html = schema.map(f => {
        const val = f.fill === 'projectId' ? (this.projectId || '') : '';
        const inp = f.type === 'textarea'
          ? `<textarea name="field_${f.name}" ${f.required?'required':''}>${val}</textarea>`
          : `<input type="text" name="field_${f.name}" value="${val}" ${f.required?'required':''}>`;
        return `<label><span>${f.label}${f.required?' *':''}</span>${inp}</label>`;
      }).join('');
      const newNodeType = TYPE_MAP[type] || type;
      const pair = findEdgePair(data.node_type, newNodeType);
      if (pair) {
        const [fwd, rev] = pair.a === data.node_type
          ? [pair.a_to_b, pair.b_to_a] : [pair.b_to_a, pair.a_to_b];
        html += `<div style="margin-top:8px;padding:6px;background:#0f1117;border-radius:4px;font-size:11px;color:#94a3b8;">
          Edges: this → <em>${fwd}</em> → new &nbsp;|&nbsp; new → <em>${rev}</em> → this
        </div>`;
        html += `<input type="hidden" name="edge_fwd" value="${fwd}">`;
        html += `<input type="hidden" name="edge_rev" value="${rev}">`;
      } else {
        const opts = ALL_EDGE_TYPES.map(e => `<option value="${e}">${e}</option>`).join('');
        html += `<label><span>Edge (this → new)</span><select name="edge_fwd">${opts}</select></label>`;
        html += `<input type="hidden" name="edge_rev" value="">`;
      }
      container.innerHTML = html;
    }
  },

  async submitAddLink() {
    const data = this.editingNode;
    if (!data) return;
    const form = document.getElementById('modal-form');
    const formData = new FormData(form);
    const type = formData.get('new_node_type');
    const endpoint = CREATE_ENDPOINTS[type];
    if (!endpoint) { status('Unknown type: ' + type, 'err'); return; }

    const fields = {};
    for (const [key, val] of formData.entries()) {
      if (key.startsWith('field_')) fields[key.slice(6)] = val;
    }

    try {
      let body;
      if (type === 'contexts') {
        const cf = {};
        if (fields.fields_type) cf.type = fields.fields_type;
        if (fields.fields_content) cf.content = fields.fields_content;
        if (fields.fields_description) cf.description = fields.fields_description;
        body = { fields: cf, link_to: fields.link_to || data.id };
      } else {
        body = fields;
      }

      const newNode = await apiPost(endpoint, body);

      if (type !== 'contexts') {
        const edgeFwd = formData.get('edge_fwd');
        const edgeRev = formData.get('edge_rev');
        if (edgeFwd) {
          await apiPost('/api/link', { from_id: data.id, edge: edgeFwd, to_id: newNode.id });
        }
        if (edgeRev) {
          await apiPost('/api/link', { from_id: newNode.id, edge: edgeRev, to_id: data.id });
        }
      }

      this.closeModal();
      status('Created & linked', 'ok');
      this.refresh();
    } catch(e) {
      status('Create & link failed: ' + e.message, 'err');
    }
  },

  closeModal() {
    document.getElementById('modal').style.display = 'none';
  },

  async submitCreate() {
    const tab = this.activeTab;
    const form = document.getElementById('modal-form');
    const data = Object.fromEntries(new FormData(form).entries());

    let url, body;
    if (tab === 'contexts') {
      const fields = {};
      if (data.fields_type) fields.type = data.fields_type;
      if (data.fields_content) fields.content = data.fields_content;
      if (data.fields_description) fields.description = data.fields_description;
      body = { fields, link_to: data.link_to };
      url = '/api/contexts';
    } else {
      const endpointMap = {
        projects: '/api/projects',
        modules: '/api/modules',
        submodules: '/api/submodules',
        files: '/api/files',
        tasks: '/api/tasks',
        todos: '/api/todos',
        'user-stories': '/api/user-stories',
        epics: '/api/epics',
        personas: '/api/personas',
        workflows: '/api/workflows',
      };
      url = endpointMap[tab];
      body = data;
    }

    try {
      await apiPost(url, body);
      this.closeModal();
      status('Created successfully', 'ok');
      this.refresh();
    } catch(e) {
      status('Create failed: ' + e.message, 'err');
    }
  },

  async loadCtxTaskDropdown() {
    const container = document.getElementById('ctx-id-container');
    const pid = this.projectId;
    if (!pid) {
      container.innerHTML = '<input id="ctx-id" placeholder="record id e.g. task:abc123">';
      return;
    }
    try {
      const tasks = await api(`/api/projects/${pid}/tasks`);
      if (!tasks.length) {
        container.innerHTML = '<input id="ctx-id" placeholder="No tasks found">';
        return;
      }
      container.innerHTML = '<select id="ctx-id">' +
        tasks.map(t => `<option value="${t.id}">${t.title || t.name || t.id}</option>`).join('') +
        '</select>';
    } catch(e) {
      container.innerHTML = '<input id="ctx-id" placeholder="record id e.g. task:abc123">';
    }
  },

  onCtxTypeChange() {
    const type = document.getElementById('ctx-type').value;
    const container = document.getElementById('ctx-id-container');
    if (type === 'task') {
      this.loadCtxTaskDropdown();
    } else {
      container.innerHTML = '<input id="ctx-id" placeholder="record id e.g. task:abc123">';
    }
  },

  async fetchCtx() {
    const type = document.getElementById('ctx-type').value;
    const id = document.getElementById('ctx-id').value.trim();
    const full = document.getElementById('ctx-full').checked;
    if (!id) { status('Enter an ID', 'err'); return; }
    try {
      const data = await api(`/api/ctx/${type}/${encodeURIComponent(id)}?full=${full}`);
      document.getElementById('ctx-output').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
      status('Context fetched', 'ok');
    } catch(e) {
      status('Fetch failed: ' + e.message, 'err');
    }
  },
};

// ── API helpers ───────────────────────────────────────────────────────────────

async function api(url) {
  const r = await fetch(url);
  if (!r.ok) { const e = await r.json().catch(() => ({error: r.statusText})); throw new Error(e.error || r.statusText); }
  return r.json();
}

async function apiPost(url, body) {
  const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (!r.ok) { const e = await r.json().catch(() => ({error: r.statusText})); throw new Error(e.error || r.statusText); }
  return r.json();
}

async function apiPatch(url, body) {
  const r = await fetch(url, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (!r.ok) { const e = await r.json().catch(() => ({error: r.statusText})); throw new Error(e.error || r.statusText); }
  return r.json();
}

async function apiDel(url) {
  const r = await fetch(url, { method:'DELETE' });
  if (!r.ok && r.status !== 204) { const e = await r.json().catch(() => ({error: r.statusText})); throw new Error(e.error || r.statusText); }
}

function status(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls || '';
  if (cls === 'ok') setTimeout(() => { if (el.textContent === msg) { el.textContent = 'Ready'; el.className = ''; }}, 3000);
}

// Close modal on overlay click
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') App.closeModal();
});

App.init().catch(e => status('Init failed: ' + e.message, 'err'));
</script>
